<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept School Shibra Campus - Bulk Annual Increments</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="config.js"></script>
    <script src="nav.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans" onload="initPage()">
    
    <div id="loadingOverlay" class="fixed inset-0 bg-black/40 z-50 hidden flex flex-col items-center justify-center text-white backdrop-blur-xs">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-white border-t-transparent mb-3"></div>
        <p id="loadingText" class="text-sm font-semibold tracking-wide">Processing...</p>
    </div>

    <div class="min-h-screen flex flex-col md:flex-row">
        <!-- SIDEBAR -->
        <aside id="appNav"></aside>

        <!-- MAIN -->
        <main class="flex-1 p-6 md:p-10 flex flex-col">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6 flex justify-between items-center flex-wrap gap-4">
                <div>
                    <h2 class="text-2xl font-extrabold text-indigo-950">⚡ Bulk Updation & Annual Increments</h2>
                    <p class="text-sm text-slate-500">Apply bulk increments, manage separate fee & annual fund entries with remarks</p>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="bulkDeleteSelected()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-sm">🗑️ Bulk Delete</button>
                    <button onclick="saveAllIncrementsBatch()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-sm">💾 Save Checked Changes</button>
                    </div>
            </div>

            <!-- Bulk Controls Toolbar -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 grid grid-cols-1 md:grid-cols-4 gap-4 text-xs">
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Fee Type</label>
                    <select id="bulkFeeType" class="w-full border rounded-lg p-2.5 bg-slate-50 outline-none font-medium">
                        <option value="tution fee">Monthly Tuition Fee</option>
                        <option value="annual fund">Annual Fund</option>
                    </select>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Increment Type & Value</label>
                    <div class="flex gap-1">
                        <select id="bulkIncType" class="border rounded-lg p-2.5 bg-slate-50 outline-none font-medium w-24">
                            <option value="fixed">Fixed</option>
                            <option value="percentage">%</option>
                        </select>
                        <input type="number" id="bulkIncVal" placeholder="Value" class="w-full border rounded-lg p-2.5 outline-none font-bold text-indigo-700 bg-slate-50">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-700 mb-1">Effective Period</label>
                    <select id="bulkIncPeriod" class="w-full border rounded-lg p-2.5 bg-slate-50 outline-none font-medium">
                        <option value="March 2026">March 2026</option>
                        <option value="January 2026">January 2026</option>
                        <option value="February 2026">February 2026</option>
                        <option value="April 2026">April 2026</option>
                        <option value="May 2026">May 2026</option>
                        <option value="June 2026">June 2026</option>
                        <option value="July 2026">July 2026</option>
                        <option value="August 2026">August 2026</option>
                        <option value="September 2026">September 2026</option>
                        <option value="October 2026">October 2026</option>
                        <option value="November 2026">November 2026</option>
                        <option value="December 2026">December 2026</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button onclick="applyBulkToCheckedRows()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 px-3 rounded-lg transition text-xs shadow-sm">⚡ Apply Checked Rows</button>
                </div>
            </div>

            <!-- Filters & Search Bar -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-4 flex items-center justify-between gap-3 flex-wrap">
                <div class="flex items-center gap-3">
                    <input type="text" id="incSearchInput" oninput="filterIncrementStudents()" placeholder="Search Student Name or Adm No..." class="border rounded-lg px-3 py-2 text-xs bg-slate-50 outline-none w-64">
                    <select id="classFilter" onchange="filterIncrementStudents()" class="border rounded-lg px-3 py-2 text-xs bg-slate-50 outline-none font-medium text-slate-700">
                        <option value="ALL">🔍 All Classes</option>
                    </select>
                </div>
                <span class="text-xs text-indigo-700 font-bold" id="incCountInfo">Total Students: 0</span>
            </div>

            <!-- Table Section -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex-1 flex flex-col">
                <div class="overflow-x-auto max-h-[55vh] flex-1">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead class="sticky top-0 bg-slate-100 text-slate-600 border-b">
                            <tr>
                                <th class="p-2.5 w-10 text-center"><input type="checkbox" id="selectAllCheckbox" onclick="toggleSelectAll(this)"></th>
                                <th class="p-2.5 cursor-pointer hover:text-indigo-700" onclick="sortTable('admis_no')">Admis No ↕</th>
                                <th class="p-2.5 cursor-pointer hover:text-indigo-700" onclick="sortTable('student_name')">Student Name ↕</th>
                                <th class="p-2.5 cursor-pointer hover:text-indigo-700" onclick="sortTable('class')">Class ↕</th>
                                <th class="p-2.5">Fee Type</th>
                                <th class="p-2.5">New Fee</th>
                                <th class="p-2.5">Effective Period</th>
                                <th class="p-2.5">Old Fee</th>
                                <th class="p-2.5">Fee Increment</th>
                                <th class="p-2.5">Annual Fund</th>
                                <th class="p-2.5">Remarks</th>
                                <th class="p-2.5 text-center">Action</th>
                            </tr>
                        </thead>
                        <tbody id="incrementTableBody">
                            <tr><td colspan="12" class="p-6 text-center text-slate-400">Loading student records...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Settings Modal -->
    

    <script>
        let allStudentsCache = [];
        let incrementsCache = [];
        let currentSortColumn = '';
        let sortDirection = 'asc';

        function showLoading(text = "Processing...") {
            document.getElementById('loadingText').innerText = text;
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }
        function hideLoading() { document.getElementById('loadingOverlay').classList.add('hidden'); }



        async function initPage() {
            let config = getSupabaseConfig();
            if(!config.url || !config.key) { }
            else {
                showLoading("Loading Increments & Students Data...");
                await fetchIncrementsCache();
                await fetchStudents();
                hideLoading();
            }
        }

        async function fetchIncrementsCache() {
            let config = getSupabaseConfig();
            incrementsCache = [];
            try {
                let res = await sbFetchAll('increments', 'select=*');
                let data = await res.json();
                if(Array.isArray(data)) incrementsCache = data;
            } catch(e) { console.error("Error fetching increments:", e); }
        }

        async function fetchStudents() {
            let config = getSupabaseConfig();
            try {
                let res = await sbFetchAll('students', 'select=*');
                let data = await res.json();
                if(Array.isArray(data)) {
                    allStudentsCache = data;
                    populateClassDropdown(data);
                    filterIncrementStudents();
                }
            } catch(e) { console.error("Error fetching students:", e); }
        }

        function populateClassDropdown(data) {
            let classSet = new Set();
            data.forEach(row => { if(row.class) classSet.add(row.class.trim()); });
            let classFilter = document.getElementById('classFilter');
            let currentSelected = classFilter.value;
            classFilter.innerHTML = `<option value="ALL">🔍 All Classes</option>`;
            Array.from(classSet).sort().forEach(cls => {
                let opt = document.createElement('option');
                opt.value = cls; opt.innerText = cls;
                classFilter.appendChild(opt);
            });
            if(classSet.has(currentSelected)) classFilter.value = currentSelected;
        }

        function filterIncrementStudents() {
            let q = document.getElementById('incSearchInput').value.trim().toLowerCase();
            let selectedClass = document.getElementById('classFilter').value;

            let filtered = allStudentsCache.filter(st => {
                let adm = (st.admis_no || '').toLowerCase();
                let name = (st.student_name || '').toLowerCase();
                let cls = (st.class || '').trim();
                let matchesQuery = adm.includes(q) || name.includes(q);
                let matchesClass = selectedClass === 'ALL' || cls === selectedClass;
                return matchesQuery && matchesClass;
            });

            if (currentSortColumn) {
                filtered.sort((a, b) => {
                    let valA = (a[currentSortColumn] || '').toString().toLowerCase();
                    let valB = (b[currentSortColumn] || '').toString().toLowerCase();
                    if (!isNaN(valA) && !isNaN(valB)) {
                        valA = parseFloat(valA);
                        valB = parseFloat(valB);
                    }
                    if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                    if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }

            renderIncrementTable(filtered);
        }

        function sortTable(column) {
            if (currentSortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                currentSortColumn = column;
                sortDirection = 'asc';
            }
            filterIncrementStudents();
        }

        function toggleSelectAll(source) {
            let checkboxes = document.querySelectorAll('.row-checkbox');
            checkboxes.forEach(cb => cb.checked = source.checked);
        }

        function calculateNewFee(idx) {
            let oldFee = parseFloat(document.getElementById(`oldfee_${idx}`).value) || 0;
            let feeInc = parseFloat(document.getElementById(`feeinc_${idx}`).value) || 0;
            document.getElementById(`newfee_${idx}`).value = oldFee + feeInc;
        }

        function renderIncrementTable(studentsList) {
            let tbody = document.getElementById('incrementTableBody');
            tbody.innerHTML = '';
            document.getElementById('selectAllCheckbox').checked = false;

            if(studentsList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="12" class="p-6 text-center text-slate-400">No student records found.</td></tr>`;
                document.getElementById('incCountInfo').innerText = `Total Students: 0`;
                return;
            }

            let defaultFeeType = document.getElementById('bulkFeeType').value;

            studentsList.forEach((st, idx) => {
                let admNo = (st.admis_no || st.sr_no || '').trim();
                let sName = (st.student_name || '').trim();
                let sClass = (st.class || '').trim();
                let existingInc = incrementsCache.find(i => (i.admis_no || '').trim() === admNo);

                let feeType = existingInc ? (existingInc.fee_type || defaultFeeType) : defaultFeeType;
                let oldFee = existingInc ? (existingInc.old_fee || st.monthly_tution_fee || 0) : (st.monthly_tution_fee || 0);
                let feeInc = existingInc ? (existingInc.fee_increament || '') : '';
                let newFee = existingInc ? (existingInc.new_fee || (oldFee + (parseFloat(feeInc) || 0))) : '';
                let effPeriod = existingInc ? (existingInc.effective_period || 'March 2026') : 'March 2026';
                let annualFund = existingInc ? (existingInc.annual_fund || st.annual_fund || '') : (st.annual_fund || '');
                let remarks = existingInc ? (existingInc.remarks || '') : '';

                let tr = document.createElement('tr');
                tr.className = "border-b hover:bg-slate-50 inc-row";
                tr.dataset.admNo = admNo;
                tr.dataset.sName = sName;
                tr.innerHTML = `
                    <td class="p-2.5 text-center"><input type="checkbox" class="row-checkbox" data-index="${idx}"></td>
                    <td class="p-2.5 font-mono text-indigo-900">${esc(admNo)}</td>
                    <td class="p-2.5 font-semibold">${esc(sName)}</td>
                    <td class="p-2.5 text-slate-600">${esc(sClass)}</td>
                    <td class="p-2.5"><input type="text" id="ftype_${idx}" value="${esc(feeType)}" class="w-24 border rounded p-1 text-xs bg-white outline-none"></td>
                    <td class="p-2.5"><input type="number" id="newfee_${idx}" value="${newFee}" placeholder="New Fee" class="w-24 border rounded p-1 text-xs bg-white outline-none font-bold text-indigo-700"></td>
                    <td class="p-2.5"><input type="text" id="eff_${idx}" value="${esc(effPeriod)}" class="w-24 border rounded p-1 text-xs bg-white outline-none"></td>
                    <td class="p-2.5 font-bold text-slate-700">PKR <input type="number" id="oldfee_${idx}" value="${oldFee}" class="w-20 border rounded p-1 text-xs bg-slate-100 font-bold" readonly></td>
                    <td class="p-2.5"><input type="number" id="feeinc_${idx}" value="${feeInc}" placeholder="Increment" oninput="calculateNewFee(${idx})" class="w-24 border rounded p-1 text-xs bg-white outline-none font-bold text-indigo-700"></td>
                    <td class="p-2.5"><input type="number" id="annualfund_${idx}" value="${annualFund}" placeholder="Annual Fund" class="w-24 border rounded p-1 text-xs bg-white outline-none font-bold text-emerald-700"></td>
                    <td class="p-2.5"><input type="text" id="remarks_${idx}" value="${esc(remarks)}" placeholder="Remarks" class="w-28 border rounded p-1 text-xs bg-white outline-none"></td>
                    <td class="p-2.5 text-center">
                        <button onclick="saveByIdx(${idx})" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1 rounded font-semibold transition text-[11px] border border-indigo-200">💾 Save</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            document.getElementById('incCountInfo').innerText = `Total Students: ${studentsList.length}`;
        }

function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
        function saveByIdx(i) { const tr = document.querySelectorAll('.inc-row')[i]; if(tr) saveOrUpdateIncrement(tr.dataset.admNo, tr.dataset.sName, i); }
        function applyBulkToCheckedRows() {
            let checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if(checkedBoxes.length === 0) { alert("Please check at least one student row!"); return; }

            let feeType = document.getElementById('bulkFeeType').value;
            let incType = document.getElementById('bulkIncType').value;
            let incVal = parseFloat(document.getElementById('bulkIncVal').value) || 0;
            let effectivePeriod = document.getElementById('bulkIncPeriod').value;

            checkedBoxes.forEach(cb => {
                let idx = cb.getAttribute('data-index');
                document.getElementById(`ftype_${idx}`).value = feeType;
                document.getElementById(`eff_${idx}`).value = effectivePeriod;

                let oldFee = parseFloat(document.getElementById(`oldfee_${idx}`).value) || 0;
                if(incVal > 0) {
                    let calculatedInc = incType === 'percentage' ? Math.round(oldFee * incVal / 100) : incVal;
                    if(feeType === 'tution fee') {
                        document.getElementById(`feeinc_${idx}`).value = calculatedInc;
                        document.getElementById(`newfee_${idx}`).value = oldFee + calculatedInc;
                    } else if(feeType === 'annual fund') {
                        document.getElementById(`annualfund_${idx}`).value = calculatedInc;
                    }
                }
            });
            alert("Bulk values applied to checked rows successfully!");
        }

        async function saveOrUpdateIncrement(admNo, sName, idx) {
            let config = getSupabaseConfig();
            let feeType = document.getElementById(`ftype_${idx}`).value.trim();
            let newFee = parseFloat(document.getElementById(`newfee_${idx}`).value) || 0;
            let effPeriod = document.getElementById(`eff_${idx}`).value.trim();
            let oldFee = parseFloat(document.getElementById(`oldfee_${idx}`).value) || 0;
            let feeInc = parseFloat(document.getElementById(`feeinc_${idx}`).value) || 0;
            let annualFund = parseFloat(document.getElementById(`annualfund_${idx}`).value) || 0;
            let remarks = document.getElementById(`remarks_${idx}`).value.trim();

            let payload = { 
                admis_no: admNo, 
                student_name: sName, 
                fee_type: feeType, 
                new_fee: newFee, 
                effective_period: effPeriod, 
                old_fee: oldFee, 
                fee_increament: feeInc, 
                annual_fund: annualFund,
                remarks: remarks
            };

            showLoading("Saving Increment Record...");
            try {
                let existing = incrementsCache.find(i => (i.admis_no || '').trim() === admNo);
                let res;

                if (existing) {
                    res = await fetch(`${config.url}/rest/v1/increments?admis_no=eq.${encodeURIComponent(admNo)}`, {
                        method: 'PATCH',
                        headers: { 
                            "apikey": config.key, 
                            "Authorization": `Bearer ${config.key}`, 
                            "Content-Type": "application/json", 
                            "Prefer": "return=minimal" 
                        },
                        body: JSON.stringify(payload)
                    });
                } else {
                    res = await fetch(`${config.url}/rest/v1/increments`, {
                        method: 'POST',
                        headers: { 
                            "apikey": config.key, 
                            "Authorization": `Bearer ${config.key}`, 
                            "Content-Type": "application/json", 
                            "Prefer": "return=minimal" 
                        },
                        body: JSON.stringify(payload)
                    });
                }

                if(res.ok) {
                    await fetchIncrementsCache();
                    filterIncrementStudents();
                    hideLoading();
                    alert("Increment Saved Successfully!");
                } else {
                    let err = await res.text();
                    hideLoading();
                    alert("Failed to save increment: " + err);
                }
            } catch(e) { hideLoading(); console.error(e); alert("Connection error."); }
        }

        async function saveAllIncrementsBatch() {
            let checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if(checkedBoxes.length === 0) { alert("Please check at least one student row to save!"); return; }

            showLoading("Saving Checked Changes...");
            let config = getSupabaseConfig();

            try {
                for(let cb of checkedBoxes) {
                    let idx = cb.getAttribute('data-index');
                    let row = cb.closest('tr');
                    let admNo = row.dataset.admNo;
                    let sName = row.dataset.sName;
                    let feeType = document.getElementById(`ftype_${idx}`).value.trim();
                    let newFee = parseFloat(document.getElementById(`newfee_${idx}`).value) || 0;
                    let effPeriod = document.getElementById(`eff_${idx}`).value.trim();
                    let oldFee = parseFloat(document.getElementById(`oldfee_${idx}`).value) || 0;
                    let feeInc = parseFloat(document.getElementById(`feeinc_${idx}`).value) || 0;
                    let annualFund = parseFloat(document.getElementById(`annualfund_${idx}`).value) || 0;
                    let remarks = document.getElementById(`remarks_${idx}`).value.trim();

                    let payload = { 
                        admis_no: admNo, 
                        student_name: sName, 
                        fee_type: feeType, 
                        new_fee: newFee, 
                        effective_period: effPeriod, 
                        old_fee: oldFee, 
                        fee_increament: feeInc, 
                        annual_fund: annualFund,
                        remarks: remarks
                    };

                    let existing = incrementsCache.find(i => (i.admis_no || '').trim() === admNo);

                    if (existing) {
                        await fetch(`${config.url}/rest/v1/increments?admis_no=eq.${encodeURIComponent(admNo)}`, {
                            method: 'PATCH',
                            headers: { 
                                "apikey": config.key, 
                                "Authorization": `Bearer ${config.key}`, 
                                "Content-Type": "application/json", 
                                "Prefer": "return=minimal" 
                            },
                            body: JSON.stringify(payload)
                        });
                    } else {
                        await fetch(`${config.url}/rest/v1/increments`, {
                            method: 'POST',
                            headers: { 
                                "apikey": config.key, 
                                "Authorization": `Bearer ${config.key}`, 
                                "Content-Type": "application/json", 
                                "Prefer": "return=minimal" 
                            },
                            body: JSON.stringify(payload)
                        });
                    }
                }

                await fetchIncrementsCache();
                filterIncrementStudents();
                hideLoading();
                alert("Checked Increments Saved Successfully!");
            } catch(e) {
                hideLoading();
                console.error(e);
                alert("Error during batch saving.");
            }
        }

        async function bulkDeleteSelected() {
            let checkedBoxes = document.querySelectorAll('.row-checkbox:checked');
            if(checkedBoxes.length === 0) { alert("Please select at least one row to delete!"); return; }
            if(!confirm(`Kya aap selected students ke increments delete karna chahte hain?`)) return;

            showLoading("Deleting Selected Records...");
            let config = getSupabaseConfig();

            try {
                for(let cb of checkedBoxes) {
                    let row = cb.closest('tr');
                    let admNo = row.dataset.admNo;
                    await fetch(`${config.url}/rest/v1/increments?admis_no=eq.${encodeURIComponent(admNo)}`, {
                        method: 'DELETE',
                        headers: { "apikey": config.key, "Authorization": `Bearer ${config.key}` }
                    });
                }
                await fetchIncrementsCache();
                filterIncrementStudents();
                hideLoading();
                alert("Selected Records Successfully Deleted!");
            } catch(e) {
                hideLoading();
                console.error(e);
                alert("Error during bulk delete.");
            }
        }




    </script>
</body>
</html>
