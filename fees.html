<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept School Shibra Campus - Fee & Voucher Management</title>
    <!-- Tailwind CSS for Responsive Design (Mobile & Desktop) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Navbar -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-base md:text-xl font-bold">🏫 Concept School Shibra Campus</h1>
                <p class="text-xs text-indigo-200">Fee Vouchers & Collection Module</p>
            </div>
            <a href="books.html" class="text-xs bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg transition">📚 Go to Book Store</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- SECTION 1: Generate Fee Voucher Form -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-1">
            <h2 class="text-lg font-semibold mb-4 text-indigo-700 border-b pb-2">Generate Fee Voucher</h2>
            
            <form id="feeForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Student Name & ID</label>
                    <input type="text" id="studentName" required placeholder="e.g. Ali Ahmed (Class 5)" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Fee Type</label>
                    <select id="feeType" onchange="toggleFeeType()" class="w-full border rounded-lg p-2.5 text-sm bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Monthly Tuition Fee">Monthly Tuition Fee</option>
                        <option value="Admission Fee">Admission Fee (One-time)</option>
                        <option value="Registration Fee">Registration Fee (One-time)</option>
                        <option value="Annual Charges">Annual Charges (Once a year)</option>
                    </select>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Month / Session</label>
                        <input type="text" id="feeMonth" required placeholder="e.g. October 2026" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Standard Amount (PKR)</label>
                        <input type="number" id="standardAmount" required min="0" placeholder="0" oninput="calculateFeeNet()" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                </div>

                <!-- Concession / Discount Section -->
                <div class="bg-indigo-50/50 p-3 rounded-lg border border-indigo-100 space-y-3">
                    <label class="block text-xs font-semibold text-indigo-900">Concession / Scholarship Discount</label>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <select id="feeDiscType" onchange="calculateFeeNet()" class="w-full border rounded-lg p-2 text-xs bg-white outline-none">
                                <option value="percentage">Percentage (%)</option>
                                <option value="fixed">Fixed Amount (PKR)</option>
                            </select>
                        </div>
                        <div>
                            <input type="number" id="feeDiscVal" min="0" value="0" oninput="calculateFeeNet()" placeholder="Discount value" class="w-full border rounded-lg p-2 text-xs bg-white outline-none">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-900 mb-1">Payable Amount (PKR)</label>
                    <input type="text" id="netPayable" readonly class="w-full bg-slate-100 font-bold text-indigo-700 border rounded-lg p-2.5 text-base outline-none" value="0">
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition text-sm shadow-sm">
                    Save Voucher to Sheet
                </button>
            </form>
        </section>

        <!-- SECTION 2: Fee Records & Status Table -->
        <section class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 lg:col-span-2">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h2 class="text-lg font-semibold text-indigo-700">Fee Vouchers & Dues Record</h2>
                <button onclick="fetchFees()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1.5 rounded-lg border transition">
                    🔄 Refresh Records
                </button>
            </div>

            <!-- Responsive Table Container -->
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 border-b">
                            <th class="p-3">Student Name</th>
                            <th class="p-3">Fee Type</th>
                            <th class="p-3">Period</th>
                            <th class="p-3">Payable</th>
                            <th class="p-3">Status</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="feeTableBody">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-slate-400">Loading vouchers list...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- JavaScript Logic -->
    <script>
        const API_URL = 'https://sheetdb.io/api/v1/YOUR_SHEETDB_ID';

        function calculateFeeNet() {
            let amount = parseFloat(document.getElementById('standardAmount').value) || 0;
            let discType = document.getElementById('feeDiscType').value;
            let discVal = parseFloat(document.getElementById('feeDiscVal').value) || 0;
            let finalDisc = 0;

            if (discType === 'percentage') {
                finalDisc = (amount * discVal) / 100;
            } else {
                finalDisc = discVal;
            }

            let net = amount - finalDisc;
            document.getElementById('netPayable').value = net > 0 ? net.toFixed(2) : 0;
        }

        document.getElementById('feeForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const feeData = {
                voucher_id: 'V-CH-' + Date.now(),
                student: document.getElementById('studentName').value,
                type: document.getElementById('feeType').value,
                period: document.getElementById('feeMonth').value,
                payable: document.getElementById('netPayable').value,
                status: 'Unpaid',
                date: new Date().toLocaleDateString()
            };

            alert("Fee Voucher Generated Successfully! (Connect SheetDB API URL to save in Google Sheets).");
            console.log("Voucher Data:", feeData);
        });

        async function fetchFees() {
            console.log("Fetching fee records...");
        }
    </script>
</body>
</html>
