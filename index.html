<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concept School Shibra Campus - Dashboard</title>
    <script>window.__show=function(){document.documentElement.style.visibility='visible'};document.documentElement.style.visibility='hidden';setTimeout(window.__show,4000);</script>
    <link rel="stylesheet" href="styles.css" onload="__show()" onerror="var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';s.onload=function(){setTimeout(__show,120)};s.onerror=__show;document.head.appendChild(s)">
    <script src="config.js"></script>
    <script src="nav.js"></script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans" onload="initDashboard()">
<div class="min-h-screen flex flex-col md:flex-row">
    <aside id="appNav"></aside>
    <main class="flex-1 min-w-0 p-3 md:p-8 space-y-4">
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
            <div>
                <h2 class="text-xl md:text-3xl font-extrabold text-indigo-950 tracking-tight">Concept School Shibra Campus</h2>
                <p id="dateLine" class="text-sm text-slate-500 font-medium"></p>
            </div>
            <button onclick="initDashboard()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-4 py-2 rounded-xl text-sm font-semibold">🔄 Refresh</button>
        </div>

        <div id="cards" class="grid grid-cols-2 lg:grid-cols-3 gap-3"></div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                <h3 class="font-bold text-indigo-900 text-sm mb-3">Pending dues by class (up to this month)</h3>
                <div id="classRows" class="space-y-2 text-sm"></div>
            </section>
            <section class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
                <h3 class="font-bold text-indigo-900 text-sm mb-3">Quick actions</h3>
                <div class="grid grid-cols-2 gap-2 text-sm font-semibold">
                    <a href="fees.html" class="border rounded-xl p-3 hover:bg-slate-50">💸 Fee Vouchers</a>
                    <a href="followups.html" class="border rounded-xl p-3 hover:bg-slate-50">📞 Follow-up Calls</a>
                    <a href="students.html" class="border rounded-xl p-3 hover:bg-slate-50">👨‍🎓 Students</a>
                    <a href="accounts.html" class="border rounded-xl p-3 hover:bg-slate-50">💰 Accounts & Daybook</a>
                    <a href="increments.html" class="border rounded-xl p-3 hover:bg-slate-50">⚡ Bulk Updation</a>
                    <a href="settings.html" class="border rounded-xl p-3 hover:bg-slate-50">⚙️ System Settings</a>
                </div>
                <p id="warnLine" class="text-xs text-amber-700 mt-3"></p>
            </section>
        </div>
        <footer class="text-center text-xs text-slate-400 pt-4">Concept School Shibra Campus &copy; 2026</footer>
    </main>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (Number(n) || 0).toLocaleString('en-US');
const MONTHS = ['january','february','march','april','may','june','july','august','september','october','november','december'];
function rank(p) { const a = String(p || '').trim().toLowerCase().split(/\s+/), m = MONTHS.indexOf(a[0]); return m < 0 ? null : (parseInt(a[1]) || 0) * 12 + m; }

async function initDashboard() {
    const now = new Date(), cur = now.getFullYear() * 12 + now.getMonth(), today = now.toLocaleDateString('en-CA'), ym = today.slice(0, 7);
    $('dateLine').innerText = now.toLocaleDateString('en-GB', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' });
    $('cards').innerHTML = '<div class="col-span-full text-center text-sm text-slate-400 p-6">Loading...</div>';
    try {
        const [sR, fR, aR, bR, pR] = await Promise.all([
            sbFetchAll('students', 'select=admis_no,status,class'),
            sbFetchAll('fees', 'select=voucher_id,class,period,payable,discount'),
            sbFetchAll('accounts', 'select=voucher_id,from_account,to_account,description,amount_in,amount_out,date'),
            sbFetchAll('books', 'select=*'),
            sbFetchAll('settings', 'select=*&setting_key=eq.Book%20Promise')
        ]);
        const students = await sR.json(), fees = await fR.json(), acc = await aR.json();
        const bookRows = bR.ok ? await bR.json() : [], promRows = pR.ok ? await pR.json() : [];
        if (![students, fees, acc].every(Array.isArray)) throw new Error('load');

        const active = students.filter(s => { const t = String(s.status || '').trim().toLowerCase(); return t === '' || t === 'active'; }).length;
        const paidBy = {}, known = new Set(fees.map(f => String(f.voucher_id || '').trim()));
        let today$ = 0, month$ = 0;
        acc.forEach(a => {
            const v = String(a.voucher_id || '').trim().split('-').slice(0, 2).join('-'), amt = parseFloat(a.amount_in) || 0;
            if (!known.has(v)) return;                      // only fee receipts
            paidBy[v] = (paidBy[v] || 0) + amt;
            const d = String(a.date || '').slice(0, 10);
            if (d === today) today$ += amt;
            if (d.slice(0, 7) === ym) month$ += amt;
        });
        let pending = 0, unpaid = 0; const byClass = {};
        fees.forEach(f => {
            const r = rank(f.period); if (r !== null && r > cur) return;      // later months are not dues yet
            const v = String(f.voucher_id || '').trim(), bal = (parseFloat(f.payable) || 0) - (parseFloat(f.discount) || 0) - (paidBy[v] || 0);
            if (bal > 0) { pending += bal; unpaid++; const c = String(f.class || '-').trim() || '-'; byClass[c] = (byClass[c] || 0) + bal; }
        });
        const cards = [
            ['Active students', fmt(active), 'text-indigo-900', `${students.length - active} left / inactive`],
            ['Pending dues', 'PKR ' + fmt(pending), 'text-rose-600', `${fmt(unpaid)} unpaid vouchers`],
            ['Collected today', 'PKR ' + fmt(today$), 'text-emerald-600', 'fee receipts'],
            ['Collected this month', 'PKR ' + fmt(month$), 'text-emerald-700', 'fee receipts']
        ];
        const nbr = (Array.isArray(bookRows) ? bookRows : []).map(normBookRow), dues = computeDues(nbr, acc), bdues = computeBookDues(nbr, acc), prom = parsePromises(Array.isArray(promRows) ? promRows : []);
        const recv = dues.reduce((t, p) => t + Math.max(p.recv.pending, 0), 0), pay = dues.reduce((t, p) => t + Math.max(p.pay.pending, 0), 0);
        const overdue = dues.filter(p => (p.recv.pending > 0.005 || p.pay.pending > 0.005) && prom[p.key] && prom[p.key].d < today).length;
        const brecv = bdues.reduce((t, p) => t + Math.max(p.recv.pending, 0), 0), bpay = bdues.reduce((t, p) => t + Math.max(p.pay.pending, 0), 0);
        cards.push(['Receivable (to receive)', 'PKR ' + fmt(recv), 'text-emerald-700', `${dues.filter(p => p.recv.pending > 0.005).length} parties · Book Store PKR ${fmt(brecv)}` + (overdue ? ` · ${overdue} promise(s) overdue` : '')]);
        cards.push(['Payable (to pay)', 'PKR ' + fmt(pay), 'text-rose-600', `${dues.filter(p => p.pay.pending > 0.005).length} parties · Book Store PKR ${fmt(bpay)}`]);
        $('cards').innerHTML = cards.map(c => `<div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm"><div class="text-xs text-slate-500 font-semibold">${c[0]}</div><div class="text-lg md:text-2xl font-extrabold ${c[2]} mt-1">${c[1]}</div><div class="text-[11px] text-slate-400 mt-0.5">${c[3]}</div></div>`).join('');
        const rows = Object.entries(byClass).sort((a, b) => b[1] - a[1]), max = rows.length ? rows[0][1] : 1;
        $('classRows').innerHTML = rows.length ? rows.map(([c, v]) => `<div><div class="flex justify-between text-xs mb-0.5"><span class="font-semibold">${esc(c)}</span><span class="text-rose-600 font-bold">PKR ${fmt(v)}</span></div><div class="h-2 bg-slate-100 rounded"><div class="h-2 bg-rose-400 rounded" style="width:${Math.max(3, v / max * 100)}%"></div></div></div>`).join('') : '<p class="text-sm text-emerald-600">No pending dues. 🎉</p>';
    } catch (e) {
        console.error(e);
        $('cards').innerHTML = '<div class="col-span-full text-center text-sm text-rose-500 p-6">Could not load dashboard data. Check your internet connection.</div>';
    }
}
</script>
</body>
</html>
