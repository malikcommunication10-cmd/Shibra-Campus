name: Build CSS

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'nav.js'
      - 'config.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build styles.css
        run: |
          printf '@tailwind base;\n@tailwind components;\n@tailwind utilities;\n' > /tmp/input.css
          npx --yes tailwindcss@3.4.17 -i /tmp/input.css -o styles.css --minify --content "./*.html,./nav.js,./config.js"
          ls -la styles.css

      - name: Commit styles.css
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add styles.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Build styles.css"
            git push
          fi
