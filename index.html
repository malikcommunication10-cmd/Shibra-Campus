<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Concept School Shibra Campus</title>
    <script>window.SB_NO_GUARD = true; window.__show = function () { document.documentElement.style.visibility = 'visible' }; document.documentElement.style.visibility = 'hidden'; setTimeout(window.__show, 4000);</script>
    <link rel="stylesheet" href="styles.css" onload="__show()" onerror="var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';s.onload=function(){setTimeout(__show,120)};s.onerror=__show;document.head.appendChild(s)">
    <script src="config.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-950 via-indigo-900 to-slate-900 flex items-center justify-center p-4 font-sans">
    <div class="w-full max-w-sm">
        <div class="text-center text-white mb-6">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-white/10 flex items-center justify-center text-3xl mb-3">🏫</div>
            <h1 class="text-xl font-extrabold tracking-tight">Concept School</h1>
            <p class="text-sm text-indigo-300">Shibra Campus - Management System</p>
        </div>
        <form id="loginForm" onsubmit="doLogin(event)" class="bg-white rounded-2xl shadow-2xl p-6 space-y-4">
            <div>
                <h2 class="text-lg font-bold text-indigo-950">Sign in</h2>
                <p class="text-xs text-slate-500">Use the email and password given by the administrator.</p>
            </div>
            <div>
                <label for="email" class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
                <input id="email" type="email" required autocomplete="username" placeholder="name@example.com" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 outline-none">
            </div>
            <div>
                <label for="password" class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <div class="relative">
                    <input id="password" type="password" required autocomplete="current-password" placeholder="Your password" class="w-full border border-slate-300 rounded-lg pl-3 pr-16 py-2.5 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 outline-none">
                    <button type="button" onclick="togglePw()" id="pwBtn" class="absolute right-2 top-1/2 -translate-y-1/2 text-xs font-semibold text-indigo-600 px-2 py-1">Show</button>
                </div>
            </div>
            <p id="err" class="hidden text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2"></p>
            <button id="loginBtn" type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white font-semibold rounded-lg py-2.5 text-sm shadow-sm transition">Sign in</button>
            <button id="forgotBtn" type="button" onclick="sendPasswordReset()" class="w-full text-[11px] text-indigo-600 hover:underline">Forgot password? Send a reset link to my email</button>
        </form>
        <form id="recoveryForm" onsubmit="saveRecoveredPassword(event)" class="hidden bg-white rounded-2xl shadow-2xl p-6 space-y-4">
            <div>
                <h2 class="text-lg font-bold text-indigo-950">Set a new password</h2>
                <p class="text-xs text-slate-500">Choose a new password for your school account.</p>
            </div>
            <div>
                <label for="newPassword" class="block text-xs font-semibold text-slate-600 mb-1">New password</label>
                <input id="newPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="At least 8 characters" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 outline-none">
            </div>
            <div>
                <label for="confirmPassword" class="block text-xs font-semibold text-slate-600 mb-1">Confirm new password</label>
                <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" placeholder="Type the password again" class="w-full border border-slate-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-indigo-200 focus:border-indigo-500 outline-none">
            </div>
            <p id="recoveryMsg" role="status" class="hidden text-xs font-semibold rounded-lg px-3 py-2"></p>
            <button id="recoveryBtn" type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:opacity-60 text-white font-semibold rounded-lg py-2.5 text-sm shadow-sm transition">Save new password</button>
            <button type="button" onclick="cancelRecovery()" class="w-full text-[11px] text-slate-500 hover:underline">Back to sign in</button>
        </form>
        <p class="text-center text-[11px] text-indigo-300/70 mt-4">&copy; <span id="copyrightYear"></span> Concept School Shibra Campus</p>
    </div>
<script>
    document.getElementById('copyrightYear').textContent = new Date().getFullYear();
    const $ = id => document.getElementById(id);
    const recoveryParams = new URLSearchParams(location.hash.replace(/^#/, ''));
    const isRecoveryLink = recoveryParams.get('type') === 'recovery';
    if (isRecoveryLink) {
        const accessToken = recoveryParams.get('access_token');
        const refreshToken = recoveryParams.get('refresh_token');
        history.replaceState(null, document.title, location.pathname + location.search);
        sbClearAuth();
        if (accessToken) {
            sbSaveSession({ access_token: accessToken, refresh_token: refreshToken, expires_in: Number(recoveryParams.get('expires_in')) || 3600 });
            $('loginForm').classList.add('hidden');
            $('recoveryForm').classList.remove('hidden');
            $('newPassword').focus();
        } else {
            $('err').textContent = 'This reset link is invalid or expired. Request a new link and try again.';
            $('err').classList.remove('hidden');
        }
    } else if (sbSession() && sbLoadMeCache()) {
        location.replace(sbFirstPage(sbLoadMeCache()) || 'index.html');
    }
    function togglePw() { const p = $('password'), show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('pwBtn').innerText = show ? 'Hide' : 'Show'; }
    function showErr(m) { $('err').innerText = m; $('err').className = 'text-xs font-semibold text-rose-600 bg-rose-50 border border-rose-200 rounded-lg px-3 py-2'; }
    async function sendPasswordReset() {
        const email = $('email').value.trim();
        if (!email) { showErr('Enter your email address first.'); $('email').focus(); return; }
        if (location.protocol === 'file:') { showErr('Open the school app from its HTTPS website before requesting a reset link.'); return; }
        const btn = $('forgotBtn'); btn.disabled = true; btn.innerText = 'Sending reset link...';
        $('err').classList.add('hidden');
        try {
            const redirectTo = `${location.origin}${location.pathname}`;
            const r = await fetch(`${SB_URL}/auth/v1/recover?redirect_to=${encodeURIComponent(redirectTo)}`, {
                method: 'POST',
                headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            if (!r.ok) {
                const j = await r.json().catch(() => ({}));
                throw new Error(j.msg || j.message || 'Could not send the reset email. Check Supabase email settings and redirect URLs.');
            }
            $('err').textContent = 'If this email belongs to an account, a password reset link has been sent. Check your inbox and spam folder.';
            $('err').className = 'text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2';
        } catch (err) {
            console.error('Password reset request failed:', err);
            showErr(err.message || 'Could not send the reset email. Please try again.');
        } finally {
            btn.disabled = false; btn.innerText = 'Forgot password? Send a reset link to my email';
        }
    }
    async function saveRecoveredPassword(e) {
        e.preventDefault();
        const password = $('newPassword').value;
        if (password.length < 8) return showRecoveryMessage('Use at least 8 characters.', false);
        if (password !== $('confirmPassword').value) return showRecoveryMessage('The passwords do not match.', false);
        const btn = $('recoveryBtn'); btn.disabled = true; btn.innerText = 'Saving password...';
        try {
            const error = await sbChangePassword(password);
            if (error) throw new Error(error);
            sbClearAuth();
            $('recoveryForm').classList.add('hidden');
            $('loginForm').classList.remove('hidden');
            $('password').value = '';
            $('email').value = '';
            $('newPassword').value = '';
            $('confirmPassword').value = '';
            showErr('Password updated. Sign in with your new password.');
            $('email').focus();
        } catch (err) {
            console.error('Password update failed:', err);
            showRecoveryMessage(err.message || 'Could not update the password. The reset link may have expired.', false);
        } finally {
            btn.disabled = false; btn.innerText = 'Save new password';
        }
    }
    function showRecoveryMessage(message, success) {
        const el = $('recoveryMsg');
        el.textContent = message;
        el.className = `text-xs font-semibold rounded-lg px-3 py-2 ${success ? 'text-emerald-700 bg-emerald-50' : 'text-rose-700 bg-rose-50'}`;
    }
    function cancelRecovery() { sbClearAuth(); location.replace(location.pathname); }
    async function doLogin(e) {
        e.preventDefault();
        $('err').classList.add('hidden');
        const btn = $('loginBtn'); btn.disabled = true; btn.innerText = 'Signing in...';
        try {
            const r = await fetch(`${SB_URL}/auth/v1/token?grant_type=password`, { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email: $('email').value.trim(), password: $('password').value }) });
            const j = await r.json().catch(() => ({}));
            if (!r.ok || !j.access_token) {
                const m = String(j.msg || j.error_description || j.message || '').toLowerCase();
                showErr(m.includes('invalid') ? 'The email or password is incorrect.' : (m.includes('confirm') ? 'This account is not confirmed yet. Ask the administrator.' : 'Could not sign in. Please try again.'));
                btn.disabled = false; btn.innerText = 'Sign in'; return;
            }
            sbSaveSession(j, true);
            try { await sbClaimDeviceSession(); }
            catch (sessionError) {
                console.error('Device session claim failed:', sessionError);
                sbClearAuth();
                showErr(sessionError.message || 'Could not start a secure session. Please try again.');
                btn.disabled = false; btn.innerText = 'Sign in'; return;
            }
            const me = await sbFetchMe();
            if (!me || me.error) { await sbReleaseDeviceSession(); sbClearAuth(); showErr('The users table is not set up yet. Run supabase_roles.sql in Supabase, then try again.'); btn.disabled = false; btn.innerText = 'Sign in'; return; }
            if (me.noaccess || me.active === false) { await sbReleaseDeviceSession(); sbClearAuth(); showErr(me.noaccess ? 'Your account has no role yet. Please ask the administrator.' : 'This account is switched off. Please ask the administrator.'); btn.disabled = false; btn.innerText = 'Sign in'; return; }
            sbSaveMe(me);
            location.replace(sbFirstPage(me) || 'index.html');
        } catch (err) { console.error(err); sbClearAuth(); showErr('No connection. Check your internet and try again.'); btn.disabled = false; btn.innerText = 'Sign in'; }
    }
    $('email').focus();
    const logoutReason = sessionStorage.getItem(SB_LOGOUT_REASON_KEY);
    if (logoutReason) {
        sessionStorage.removeItem(SB_LOGOUT_REASON_KEY);
        showErr(logoutReason === 'idle' ? 'You were signed out after 10 minutes without activity.' : logoutReason === 'replaced' ? 'This session is no longer active. Please sign in again.' : 'You have been signed out.');
    }
</script>
</body>
</html>
